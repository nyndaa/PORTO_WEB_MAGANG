<!-- ==========================================
     NAVBAR COMPONENT
     Digunakan bersama oleh seluruh halaman.
========================================== -->

<header class="sticky top-0 z-50 flex min-h-20 flex-wrap items-center justify-between gap-x-2 gap-y-3 border-b border-line bg-paper/90 py-4 backdrop-blur-md transition-colors">

    <!-- 1. Logo / Brand (Kiri Atas di HP) -->
    <a
        href="index.html"
        class="order-1 flex items-center gap-2 text-2xl font-bold tracking-tight"
        aria-label="Nadia, kembali ke Home"
    >
        <span class="text-rose text-3xl" aria-hidden="true">✿</span>
        nadia<span class="-ml-2 text-rose">.</span>
    </a>

    <!-- 2. Segmented Theme Switch (Kanan Atas di HP, Kanan di Desktop) -->
    <div
        id="theme-toggle"
        role="group"
        aria-label="Theme switcher"
        class="order-2 md:order-3 inline-flex items-center rounded-full border border-line bg-white/80 p-1 text-xs font-semibold shadow-sm"
    >
        <button
            type="button"
            data-theme-value="light"
            class="theme-option flex items-center gap-1.5 rounded-full px-2.5 py-1 transition-all duration-200 sm:px-3"
        >
            <span>☀️</span>
            <span>Light</span>
        </button>

        <button
            type="button"
            data-theme-value="dark"
            class="theme-option flex items-center gap-1.5 rounded-full px-2.5 py-1 transition-all duration-200 sm:px-3"
        >
            <span>🌙</span>
            <span>Dark</span>
        </button>
    </div>

    <!-- 3. Navigasi Utama (Baris ke-2 Penuh di HP, Tengah di Desktop) -->
    <nav
        aria-label="Main navigation"
        class="order-3 md:order-2 flex w-full flex-wrap items-center justify-around gap-x-3 border-t border-line pt-2 md:w-auto md:justify-center md:gap-7 md:border-none md:pt-0"
    >
        <a href="index.html" data-page="index.html"
           class="nav-link border-b-2 py-1.5 text-sm transition-colors border-transparent text-muted hover:text-rose md:py-2">
            Home
        </a>

        <a href="about.html" data-page="about.html"
           class="nav-link border-b-2 py-1.5 text-sm transition-colors border-transparent text-muted hover:text-rose md:py-2">
            About
        </a>

        <a href="projects.html" data-page="projects.html"
           class="nav-link border-b-2 py-1.5 text-sm transition-colors border-transparent text-muted hover:text-rose md:py-2">
            Projects
        </a>

        <a href="contact.html" data-page="contact.html"
           class="nav-link border-b-2 py-1.5 text-sm transition-colors border-transparent text-muted hover:text-rose md:py-2">
            Contact
        </a>
    </nav>

</header>
