<!-- ============ PINK CUTE GARDEN ============
Tempel kode ini DI ATAS badge "CURATED WORKS & EXPERIMENTS"
(di dalam bagian hero, sebelum judul "Made with care,").
Murni SVG + CSS, tanpa library. Latar transparan.
=========================================== -->

<style>
  .pk-garden { width: 100%; max-width: 560px; margin: 0 auto 8px; }
  .pk-garden svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* goyang bunga */
  .pk-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: pk-sway 3.6s ease-in-out infinite; }
  .pk-sway.d1 { animation-delay: -.8s; animation-duration: 4.2s; }
  .pk-sway.d2 { animation-delay: -1.7s; animation-duration: 3.2s; }
  .pk-sway.d3 { animation-delay: -2.6s; animation-duration: 3.9s; }
  @keyframes pk-sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  /* kelopak berputar pelan */
  .pk-petals { transform-box: fill-box; transform-origin: 50% 50%; animation: pk-spin 24s linear infinite; }
  @keyframes pk-spin { to { transform: rotate(360deg); } }

  /* kedip mata */
  .pk-eye { transform-box: fill-box; transform-origin: 50% 50%; animation: pk-blink 4.5s infinite; }
  @keyframes pk-blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

  /* kepak sayap kupu-kupu */
  .pk-wing { transform-box: fill-box; animation: pk-flap .35s ease-in-out infinite alternate; }
  .pk-wing.l { transform-origin: 100% 50%; }
  .pk-wing.r { transform-origin: 0% 50%; }
  @keyframes pk-flap { from { transform: scaleX(1); } to { transform: scaleX(.25); } }

  /* hati melayang naik */
  .pk-heart { opacity: 0; animation: pk-rise 5s ease-in infinite; }
  .pk-heart.h2 { animation-delay: 1.6s; animation-duration: 6s; }
  .pk-heart.h3 { animation-delay: 3.1s; animation-duration: 5.5s; }
  .pk-heart.h4 { animation-delay: 4.2s; animation-duration: 6.5s; }
  @keyframes pk-rise {
    0%   { opacity: 0; transform: translateY(0) scale(.6); }
    15%  { opacity: .9; }
    100% { opacity: 0; transform: translateY(-110px) scale(1.15); }
  }

  /* kilau bintang */
  .pk-star { transform-box: fill-box; transform-origin: center; animation: pk-twinkle 2.4s ease-in-out infinite; }
  .pk-star.s2 { animation-delay: -.8s; } .pk-star.s3 { animation-delay: -1.6s; }
  @keyframes pk-twinkle { 0%,100% { opacity: .25; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(45deg); } }

  /* bukit bernapas */
  .pk-hill { animation: pk-breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes pk-breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.04); } }

  @media (prefers-reduced-motion: reduce) {
    .pk-garden * { animation: none !important; }
    .pk-heart { opacity: .8; }
  }
</style>

<div class="pk-garden" aria-hidden="true">
<svg viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bunga imut berwajah (titik tengah di 0,0; dasar batang di y=100) -->
    <g id="pk-flower">
      <path d="M0 0 C-3 40 3 60 0 100" stroke="#8fb996" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M0 72 C-26 56 -36 70 -31 84 C-18 87 -6 82 0 72Z" fill="#a9cdb0"/>
      <path d="M0 62 C26 46 36 60 31 74 C18 77 6 72 0 62Z" fill="#b8d9be"/>
      <g class="pk-petals">
        <ellipse cx="0" cy="-24" rx="14" ry="23"/>
        <ellipse cx="0" cy="-24" rx="14" ry="23" transform="rotate(45)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="23" transform="rotate(90)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="23" transform="rotate(135)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="23" transform="rotate(180)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="23" transform="rotate(225)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="23" transform="rotate(270)"/>
        <ellipse cx="0" cy="-24" rx="14" ry="23" transform="rotate(315)"/>
      </g>
      <circle r="21" fill="#fff1c7"/>
      <ellipse class="pk-eye" cx="-7.5" cy="-2" rx="2.6" ry="3.4" fill="#5a3a4a"/>
      <ellipse class="pk-eye" cx="7.5"  cy="-2" rx="2.6" ry="3.4" fill="#5a3a4a"/>
      <circle cx="-6.6" cy="-3.2" r=".9" fill="#fff"/>
      <circle cx="8.4"  cy="-3.2" r=".9" fill="#fff"/>
      <path d="M-4 6 Q0 10.5 4 6" stroke="#5a3a4a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="-13" cy="5" r="3.6" fill="#ff9fb8" opacity=".75"/>
      <circle cx="13"  cy="5" r="3.6" fill="#ff9fb8" opacity=".75"/>
    </g>

    <path id="pk-heartshape" d="M0 -3 C-6 -10 -14 -2 0 9 C14 -2 6 -10 0 -3Z"/>
    <path id="pk-starshape" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z"/>
  </defs>

  <!-- bukit -->
  <ellipse class="pk-hill" cx="300" cy="222" rx="290" ry="34" fill="#fce4ec"/>
  <ellipse class="pk-hill" cx="300" cy="226" rx="230" ry="26" fill="#f8c9d9" opacity=".7"/>

  <!-- bintang kilau -->
  <use href="#pk-starshape" class="pk-star"    x="62"  y="48"  fill="#f2a0bd"/>
  <use href="#pk-starshape" class="pk-star s2" x="540" y="62"  fill="#e98aae" transform="translate(0,0) scale(1)"/>
  <use href="#pk-starshape" class="pk-star s3" x="300" y="22"  fill="#f6b8cd"/>

  <!-- bunga-bunga -->
  <g transform="translate(105,208) scale(.78)"><g class="pk-sway d1"><use href="#pk-flower" y="-100" fill="#f9bfd2"/></g></g>
  <g transform="translate(225,212) scale(1.12)"><g class="pk-sway"><use href="#pk-flower" y="-100" fill="#ee86ab"/></g></g>
  <g transform="translate(365,212) scale(1)"><g class="pk-sway d2"><use href="#pk-flower" y="-100" fill="#f6a5c0"/></g></g>
  <g transform="translate(485,208) scale(.82)"><g class="pk-sway d3"><use href="#pk-flower" y="-100" fill="#fbcfdd"/></g></g>

  <!-- hati melayang -->
  <use href="#pk-heartshape" class="pk-heart"    x="170" y="110" fill="#f2759f"/>
  <use href="#pk-heartshape" class="pk-heart h2" x="300" y="120" fill="#f9a3bf"/>
  <use href="#pk-heartshape" class="pk-heart h3" x="425" y="105" fill="#ee86ab"/>
  <use href="#pk-heartshape" class="pk-heart h4" x="70"  y="125" fill="#f6b8cd"/>

  <!-- kupu-kupu terbang -->
  <g>
    <g>
      <path class="pk-wing l" d="M0 0 C-16 -16 -26 -4 -18 6 C-12 12 -4 8 0 0Z" fill="#f48fb1"/>
      <path class="pk-wing r" d="M0 0 C16 -16 26 -4 18 6 C12 12 4 8 0 0Z"   fill="#f8bbd0"/>
      <ellipse cx="0" cy="2" rx="1.8" ry="6" fill="#7a4a5e"/>
    </g>
    <animateMotion dur="14s" repeatCount="indefinite" rotate="0"
      path="M40 150 C130 60 210 120 300 80 C390 40 470 110 560 70 C470 130 390 70 300 110 C210 150 130 90 40 150Z"/>
  </g>
</svg>
</div>
